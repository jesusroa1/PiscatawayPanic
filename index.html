<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Piscataway Panic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    body.vertical { flex-direction: column; justify-content: flex-start; align-items: center; }
    #ctrl-zone {
      position: fixed; bottom: 0; left: 0; right: 0; height: 200px;
      display: none; flex-direction: row;
      background: #0d0d0d; border-top: 1px solid #222; touch-action: none;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    body.vertical #ctrl-zone { display: flex; }
    #joy-area { flex: 1; position: relative; overflow: hidden; }
    #joy-ring {
      position: absolute; width: 84px; height: 84px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.22); display: none; pointer-events: none;
      transform: translate(-50%,-50%);
    }
    #joy-knob {
      position: absolute; width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.32); display: none; pointer-events: none;
      transform: translate(-50%,-50%);
    }
    #btns-area { width: 44%; display: flex; flex-direction: column; padding: 14px 14px 14px 0; gap: 10px; }
    .ctrl-btn {
      flex: 1; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer;
      user-select: none; touch-action: none; border: 2px solid;
      -webkit-tap-highlight-color: transparent;
    }
    #fire-btn { background: rgba(255,50,50,0.15); border-color: rgba(255,80,80,0.45); color: #ff9090; }
    #fire-btn.active { background: rgba(255,50,50,0.42); }
    #cake-btn { background: rgba(200,132,42,0.15); border-color: rgba(200,132,42,0.45); color: #f5dda0; }
    #cake-btn.active { background: rgba(200,132,42,0.42); }
    #toggle-btn {
      position: fixed; top: 8px; right: 8px; z-index: 999;
      background: rgba(0,0,0,0.72); border: 1px solid #3a3a3a; color: #ccc;
      font-size: 18px; width: 38px; height: 38px; cursor: pointer;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; line-height: 1;
    }
    #ai-harness {
      position: fixed; top: 54px; right: 8px; z-index: 998;
      width: 204px; display: flex; flex-direction: column; gap: 4px;
    }
    #ai-toggle-header {
      background: rgba(0,0,0,0.72); border: 1px solid #2a6a2a; color: #88ff88;
      font-size: 10px; padding: 4px 7px; border-radius: 4px; cursor: pointer;
      font-family: 'Courier New', monospace; user-select: none;
      display: flex; align-items: center; justify-content: space-between;
    }
    #ai-toggle-header:hover { border-color: #44ff44; background: rgba(0,40,0,0.85); }
    #ai-collapsible { display: none; flex-direction: column; gap: 4px; }
    #ai-harness.expanded #ai-collapsible { display: flex; }
    #ai-command-input {
      width: 100%; background: rgba(0,0,0,0.84); border: 1px solid #2a6a2a;
      color: #88ff88; font-size: 10px; padding: 5px 7px; border-radius: 4px;
      outline: none; font-family: 'Courier New', monospace; box-sizing: border-box;
    }
    #ai-command-input:focus { border-color: #44ff44; box-shadow: 0 0 5px rgba(68,255,68,0.35); }
    #ai-command-input::placeholder { color: #3a6a3a; font-style: italic; }
    #ai-command-submit {
      background: rgba(0,72,0,0.80); border: 1px solid #2a6a2a; color: #88ff88;
      font-size: 9px; padding: 3px 0; border-radius: 4px; cursor: pointer;
      font-family: 'Courier New', monospace; letter-spacing: 0.05em;
    }
    #ai-command-submit:hover { background: rgba(0,110,0,0.88); border-color: #44ff44; }
    #ai-debug-readout {
      background: rgba(0,0,0,0.82); border: 1px solid #1a4a1a;
      color: #66dd66; font-size: 9px; padding: 5px 7px; border-radius: 4px;
      white-space: pre; font-family: 'Courier New', monospace; line-height: 1.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ctrl-zone">
  <div id="joy-area">
    <div id="joy-ring"></div>
    <div id="joy-knob"></div>
  </div>
  <div id="btns-area">
    <div id="cake-btn" class="ctrl-btn">CAKE</div>
    <div id="fire-btn" class="ctrl-btn">FIRE</div>
  </div>
</div>
<button id="toggle-btn" title="Toggle orientation">↕</button>
<div id="ai-harness">
  <div id="ai-toggle-header">
    <span>⚡ AI CMD</span><span id="ai-toggle-arrow">▶</span>
  </div>
  <div id="ai-collapsible">
    <input id="ai-command-input" type="text" placeholder="go right 50 pixels" autocomplete="off" spellcheck="false">
    <button id="ai-command-submit">▶ SEND</button>
    <div id="ai-debug-readout"></div>
  </div>
</div>
<script>
// ── SETUP ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const LW = 320, LH = 180;
canvas.width = LW; canvas.height = LH;
let verticalMode = false;

const bgImg = new Image();
bgImg.src = 'bg.png';

const gooseImg = new Image();
gooseImg.src = 'goose_sprites.png';

let canvasRect = canvas.getBoundingClientRect();

// In portrait (vertical) mode the canvas is scaled to fill the available height
// and panned horizontally each frame so the player stays screen-centered.
function updateCanvasOffset() {
  if (!verticalMode) { canvas.style.transform = ''; return; }
  const s = (parseFloat(canvas.style.height) || 0) / LH;
  const playerCanvasX = (player.x - camX) * s;
  const tx = Math.round(LW * s / 2 - playerCanvasX);
  canvas.style.transform = 'translateX(' + tx + 'px)';
}

function resize() {
  if (verticalMode) {
    const ctrlH = 200;
    const s = (window.innerHeight - ctrlH) / LH;
    canvas.style.width  = Math.round(LW * s) + 'px';
    canvas.style.height = Math.round(LH * s) + 'px';
    updateCanvasOffset();
  } else {
    const s = Math.min(window.innerWidth / LW, window.innerHeight / LH);
    canvas.style.width  = Math.floor(LW * s) + 'px';
    canvas.style.height = Math.floor(LH * s) + 'px';
    canvas.style.transform = '';
  }
  requestAnimationFrame(() => { canvasRect = canvas.getBoundingClientRect(); });
}
resize();
window.addEventListener('resize', resize);

function toLogical(cx, cy) {
  return {
    x: (cx - canvasRect.left) * (LW / canvasRect.width),
    y: (cy - canvasRect.top)  * (LH / canvasRect.height),
  };
}

// ── CONSTANTS ────────────────────────────────────────────────────────────
const LEVEL_W    = 1280;
const G_TOP      = 28;
const G_BOT      = LH - 8;
const P_SPEED    = 1.7;
const PROJ_SPEED = 3.5;
const CAKE_SPEED = 3.0;
const SS_FIRE_CD = 20;
const HEAT_GAIN  = 16;
const HEAT_COOL  = 0.65;
const OVERHEAT   = 100;
const CAKE_CD    = 35;
const MAX_CAKES  = 3;

// ── STATE ─────────────────────────────────────────────────────────────────
let state = 'title';
let tick = 0, score = 0, camX = 0, touchSeen = false;

const player = {
  x: 55, y: LH / 2, angle: 0,
  hp: 5, maxHp: 5,
  heat: 0, fireCd: 0, iframes: 0,
  cakes: 0, cakeCd: 0,
};

let projs = [], enemies = [], hazards = [], items = [], particles = [], spawnIdx = 0;

// ── AI COMMAND STATE ──────────────────────────────────────────────────────
const aiCmd = {
  lastCommand: '', lastResult: '',
  pendingMove: null, // { dx, dy }
  fireSS: false, fireFC: false,
  selectedWeapon: 'softserve',
};

// Spawn table — sorted by wx so trySpawn works correctly
const SPAWNS = [
  // ── Section 1: Petrucci's Parking Lot (tutorial) ──────────────────────
  { wx: 148, type: 'cake_item' },
  { wx: 200, type: 'mower' },
  { wx: 220, type: 'dad' },
  { wx: 290, type: 'goose', wy: 95  },
  { wx: 320, type: 'guard'          },
  { wx: 390, type: 'goose', wy: 135 },

  // ── Section 2: South Washington Ave ───────────────────────────────────
  { wx: 510, type: 'goose'              },
  { wx: 545, type: 'goose', wy: 75  },
  { wx: 585, type: 'goose', wy: 145 },
  { wx: 625, type: 'dad',   wy: 100 },
  { wx: 660, type: 'goose'              },
  { wx: 695, type: 'goose', wy: 60  },
  { wx: 730, type: 'goose', wy: 140 },
  { wx: 770, type: 'goose'              },
  { wx: 810, type: 'goose', wy: 90  },
  { wx: 850, type: 'goose', wy: 155 },
  { wx: 895, type: 'goose'              },

  // ── Section 3: Johnson Park Gate ──────────────────────────────────────
  { wx: 1010, type: 'guard'             },
  { wx: 1065, type: 'mom'               },
];

// ── INPUT ─────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.id === 'ai-command-input') return;
  keys[e.key] = true;
});
document.addEventListener('keyup', e => {
  if (document.activeElement && document.activeElement.id === 'ai-command-input') return;
  keys[e.key] = false;
});

const joy    = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
const btnSS  = { active: false, id: -1 }; // soft serve
const btnFC  = { active: false, id: -1 }; // funnel cake

function onTouchStart(e) {
  e.preventDefault();
  touchSeen = true;
  canvasRect = canvas.getBoundingClientRect();
  if (verticalMode) { if (state !== 'playing') startGame(); return; }
  for (const t of e.changedTouches) {
    const p = toLogical(t.clientX, t.clientY);
    if (state !== 'playing') { startGame(); return; }
    if (p.x < LW / 2 && !joy.active) {
      Object.assign(joy, { active: true, id: t.identifier, ox: p.x, oy: p.y, dx: 0, dy: 0 });
    } else if (p.x >= LW / 2) {
      // Top-right strip (y < 55) = cake button; rest = soft serve
      if (p.y < 55 && player.cakes > 0 && !btnFC.active) {
        btnFC.active = true; btnFC.id = t.identifier;
      } else if (!btnSS.active) {
        btnSS.active = true; btnSS.id = t.identifier;
      }
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joy.id) continue;
    const p  = toLogical(t.clientX, t.clientY);
    const dx = p.x - joy.ox, dy = p.y - joy.oy;
    const r  = Math.hypot(dx, dy), max = 28;
    joy.dx = r > max ? dx / r : dx / max;
    joy.dy = r > max ? dy / r : dy / max;
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id)   { joy.active   = false; joy.dx = 0; joy.dy = 0; }
    if (t.identifier === btnSS.id) { btnSS.active  = false; }
    if (t.identifier === btnFC.id) { btnFC.active  = false; }
  }
}
canvas.addEventListener('touchstart',  onTouchStart,  { passive: false });
canvas.addEventListener('touchmove',   onTouchMove,   { passive: false });
canvas.addEventListener('touchend',    onTouchEnd,    { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd,    { passive: false });
canvas.addEventListener('pointerdown', () => { if (!touchSeen && state !== 'playing') startGame(); });

// ── VERTICAL MODE ────────────────────────────────────────────────────────
const toggleBtn  = document.getElementById('toggle-btn');
const joyArea    = document.getElementById('joy-area');
const joyRing    = document.getElementById('joy-ring');
const joyKnob    = document.getElementById('joy-knob');
const fireBtnEl  = document.getElementById('fire-btn');
const cakeBtnEl  = document.getElementById('cake-btn');
const aiInputEl    = document.getElementById('ai-command-input');
const aiSubmitEl   = document.getElementById('ai-command-submit');
const aiHarnessEl  = document.getElementById('ai-harness');
const aiArrowEl    = document.getElementById('ai-toggle-arrow');
document.getElementById('ai-toggle-header').addEventListener('click', () => {
  const expanded = aiHarnessEl.classList.toggle('expanded');
  aiArrowEl.textContent = expanded ? '▼' : '▶';
});
const extJoy     = { id: -1, ox: 0, oy: 0 };

function updateJoyVis() {
  if (!joy.active) { joyRing.style.display = 'none'; joyKnob.style.display = 'none'; return; }
  const maxR = 42;
  joyRing.style.display = 'block';
  joyRing.style.left = extJoy.ox + 'px';
  joyRing.style.top  = extJoy.oy + 'px';
  joyKnob.style.display = 'block';
  joyKnob.style.left = (extJoy.ox + joy.dx * maxR) + 'px';
  joyKnob.style.top  = (extJoy.oy + joy.dy * maxR) + 'px';
}

function onJoyTouchStart(e) {
  e.preventDefault();
  touchSeen = true;
  if (state !== 'playing') { startGame(); return; }
  for (const t of e.changedTouches) {
    if (joy.active) continue;
    const rect = joyArea.getBoundingClientRect();
    Object.assign(joy, { active: true, id: t.identifier, dx: 0, dy: 0 });
    extJoy.id = t.identifier;
    extJoy.ox = t.clientX - rect.left;
    extJoy.oy = t.clientY - rect.top;
    updateJoyVis();
  }
}
function onJoyTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== extJoy.id) continue;
    const rect = joyArea.getBoundingClientRect();
    const dx = (t.clientX - rect.left) - extJoy.ox;
    const dy = (t.clientY - rect.top)  - extJoy.oy;
    const maxR = 42, r = Math.hypot(dx, dy);
    joy.dx = r > maxR ? dx / r : dx / maxR;
    joy.dy = r > maxR ? dy / r : dy / maxR;
    updateJoyVis();
  }
}
function onJoyTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== extJoy.id) continue;
    joy.active = false; joy.dx = 0; joy.dy = 0; extJoy.id = -1;
    updateJoyVis();
  }
}
joyArea.addEventListener('touchstart',  onJoyTouchStart,  { passive: false });
joyArea.addEventListener('touchmove',   onJoyTouchMove,   { passive: false });
joyArea.addEventListener('touchend',    onJoyTouchEnd,    { passive: false });
joyArea.addEventListener('touchcancel', onJoyTouchEnd,    { passive: false });

function onFireTouchStart(e) {
  e.preventDefault(); touchSeen = true;
  if (state !== 'playing') { startGame(); return; }
  for (const t of e.changedTouches) {
    if (!btnSS.active) { btnSS.active = true; btnSS.id = t.identifier; fireBtnEl.classList.add('active'); }
  }
}
function onFireTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === btnSS.id) { btnSS.active = false; fireBtnEl.classList.remove('active'); }
  }
}
fireBtnEl.addEventListener('touchstart',  onFireTouchStart, { passive: false });
fireBtnEl.addEventListener('touchend',    onFireTouchEnd,   { passive: false });
fireBtnEl.addEventListener('touchcancel', onFireTouchEnd,   { passive: false });

function onCakeTouchStart(e) {
  e.preventDefault(); touchSeen = true;
  if (state !== 'playing') { startGame(); return; }
  for (const t of e.changedTouches) {
    if (!btnFC.active && player.cakes > 0) { btnFC.active = true; btnFC.id = t.identifier; cakeBtnEl.classList.add('active'); }
  }
}
function onCakeTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === btnFC.id) { btnFC.active = false; cakeBtnEl.classList.remove('active'); }
  }
}
cakeBtnEl.addEventListener('touchstart',  onCakeTouchStart, { passive: false });
cakeBtnEl.addEventListener('touchend',    onCakeTouchEnd,   { passive: false });
cakeBtnEl.addEventListener('touchcancel', onCakeTouchEnd,   { passive: false });

function setVerticalMode(v) {
  verticalMode = v;
  document.body.classList.toggle('vertical', v);
  toggleBtn.textContent = v ? '↔' : '↕';
  joy.active = false; joy.dx = 0; joy.dy = 0;
  btnSS.active = false; btnFC.active = false;
  fireBtnEl.classList.remove('active');
  cakeBtnEl.classList.remove('active');
  updateJoyVis();
  resize();
}
toggleBtn.addEventListener('click', () => setVerticalMode(!verticalMode));

// ── DRAW HELPERS ──────────────────────────────────────────────────────────
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

// ── BACKGROUND ────────────────────────────────────────────────────────────
function drawBg() {
  if (bgImg.complete && bgImg.naturalWidth > 0) {
    ctx.drawImage(bgImg, -camX, 0, LEVEL_W, LH);
  } else {
    // Fallback while image loads
    px(0, 0, LW, G_TOP, '#7ec8e3');
    px(0, G_TOP, LW, LH - G_TOP, '#4a4a58');
  }

  // Road centre dashes overlay (Section 2, wx 480–950)
  const roadMid = G_TOP + (G_BOT - G_TOP) / 2;
  for (let d = Math.max(480, Math.floor(camX / 24) * 24); d < Math.min(950, camX + LW); d += 24) {
    const dsx = Math.round(d - camX);
    if (dsx > -12 && dsx < LW) px(dsx, roadMid - 1, 12, 2, '#ffdd57');
  }

  // Park gate overlay (world 1148)
  const gx = Math.round(1148 - camX);
  if (gx > -58 && gx < LW + 10) {
    px(gx,      G_TOP, 5, 50, '#6b4a12');
    px(gx + 50, G_TOP, 5, 50, '#6b4a12');
    px(gx,      G_TOP, 55, 7, '#6b4a12');
    ctx.fillStyle = '#fff';
    ctx.font = '4px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('PARK', gx + 27, G_TOP + 6);
    ctx.textAlign = 'left';
  }
}

function drawPetruccis(bx) {
  px(bx, 0, 120, G_TOP + 2, '#0f0518');
  px(bx, 0, 120, 16, '#1e0a2e');
  px(bx + 4,  5, 82, 8, '#ff3c8e');
  px(bx + 5,  6, 80, 6, '#ffcce5');
  ctx.fillStyle = '#880033';
  ctx.font = '4px "Press Start 2P"';
  ctx.fillText('ICE CREAM', bx + 7, 12);
  for (let i = 0; i < 120; i++) {
    ctx.fillStyle = Math.floor(i / 6) % 2 === 0 ? '#d63384' : '#ffe4ef';
    ctx.fillRect(bx + i, 15, 1, 9);
  }
  px(bx, 24, 120, 2, '#a61e4d');
  px(bx + 5,  26, 30, 12, '#fffbee'); // window
  px(bx + 9,  26,  8,  7, '#ffb3c6'); // pink scoop
  px(bx + 11, 33,  4,  5, '#c68642');
  px(bx + 20, 26,  8,  7, '#a8e6cf'); // mint scoop
  px(bx + 22, 33,  4,  5, '#c68642');
  px(bx + 75, 26, 18, G_TOP - 26, '#2c1a07'); // door
  px(bx + 83, 30,  3,  3, '#ffd700'); // knob
  px(bx + 52, -1,  6,  2, '#c68642'); // roof cone
  px(bx + 53, -4,  4,  3, '#c68642');
  px(bx + 54, -8,  2,  4, '#c68642');
  px(bx + 51,-13,  8,  6, '#ffb3c6');
  px(bx + 54,-15,  2,  2, '#e63946');
}

function drawCar(sx, sy) {
  // Simple top-down parked car
  const cols = ['#883322','#225588','#228844','#664488'];
  const c = cols[Math.floor((sx + camX) / 65) % 4];
  px(sx - 14, sy + 4, 28, 10, c);
  px(sx - 10, sy,     20,  8, c);
  px(sx - 13, sy + 12, 6, 4, '#222');
  px(sx +  7, sy + 12, 6, 4, '#222');
}

function drawTree(sx, sy) {
  px(sx - 2, sy + 9, 4, 16, '#6b4a12');
  ctx.fillStyle = '#1a5c1a';
  ctx.beginPath(); ctx.arc(sx, sy + 6, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#236823';
  ctx.beginPath(); ctx.arc(sx, sy + 4,  6, 0, Math.PI * 2); ctx.fill();
}

// ── ENTITY DRAWING ────────────────────────────────────────────────────────
function drawPlayer() {
  if (player.iframes > 0 && Math.floor(player.iframes / 5) % 2) return;
  const sx = Math.round(player.x - camX), sy = Math.round(player.y);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(player.angle);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-5, 4, 10, 5);
  px(-5, -6, 10, 10, '#00aa44'); // body
  px(-3,-12,  7,  7, '#f5c99a'); // head
  px(-3,-15,  7,  4, '#3b1f0e'); // hair
  px( 4, -2, 11,  4, '#777777'); // cannon
  px(14, -2,  3,  4, '#ffccee'); // nozzle
  px(-4,  4,  4,  6, '#225588'); // legs
  px( 1,  4,  4,  6, '#225588');
  ctx.restore();
}

function drawEnemy(e) {
  const sx = Math.round(e.wx - camX), sy = Math.round(e.y);
  if (sx < -22 || sx > LW + 22) return;
  const fr = e.frozenTimer > 0;
  ctx.save();
  ctx.translate(sx, sy);

  if (e.type === 'dad') {
    // Radioactive Dad — wide body, Costco polo (orange-red), khaki pants
    ctx.fillStyle = fr ? 'rgba(80,150,255,0.15)' : 'rgba(0,255,80,0.12)';
    ctx.fillRect(-10, -12, 20, 24);
    const body = fr ? '#3366bb' : '#cc4400';
    const leg  = fr ? '#334466' : '#aa9955';
    px(-7, -5, 14, 11, body);                     // wide polo body
    px(-4,-11,  9,  7, fr ? '#88aacc' : '#f5c99a'); // head
    ctx.fillStyle = fr ? '#88ccff' : '#00ff44';
    ctx.fillRect(-2, -10, 2, 2); ctx.fillRect(3, -10, 2, 2); // eyes
    px(-6, 6, 6, 7, leg); px(1, 6, 6, 7, leg);   // khaki pants

    if (e.chargeState === 'warn') {
      // Telegraph: arms spread wide, flashing
      if (Math.floor(tick / 6) % 2 === 0) {
        px(-14, -3, 7, 3, body); px(7, -3, 7, 3, body);
      }
    } else {
      const a = Math.sin(tick * 0.2 + e.wx * 0.04) * 2;
      px(-10, -2 + a, 3, 7, body); px(7, -2 - a, 3, 7, body);
    }

  } else if (e.type === 'guard') {
    // Zombie Crossing Guard — orange safety vest, stop sign
    ctx.fillStyle = fr ? 'rgba(80,150,255,0.15)' : 'rgba(0,255,80,0.12)';
    ctx.fillRect(-8, -11, 16, 22);
    const vest = fr ? '#3355aa' : '#ff6600';
    const leg  = fr ? '#1133aa' : '#224488';
    px(-4, -5, 8, 10, vest);
    px(-3,-10, 7,  6, fr ? '#88aacc' : '#d4a070'); // head
    ctx.fillStyle = fr ? '#88ccff' : '#00ff44';
    ctx.fillRect(-1, -9, 2, 2); ctx.fillRect(3, -9, 2, 2);
    px(-4, 5, 4, 7, leg); px(1, 5, 4, 7, leg);
    // Stop sign (held to right)
    px(5, -10, 9, 9, '#cc1111');
    px(7,  -8, 5, 5, '#ffffff');

  } else if (e.type === 'goose') {
    if (gooseImg.complete && gooseImg.naturalWidth > 0) {
      const frame = Math.floor(tick / 8) % 4;
      const row = player.x < e.wx ? 1 : 0;
      ctx.drawImage(gooseImg, frame * 384, row * 341, 384, 341, -16, -13, 32, 26);
      if (fr) { ctx.fillStyle = 'rgba(100,180,255,0.45)'; ctx.fillRect(-16, -13, 32, 26); }
    } else {
      const bc = fr ? '#aaddff' : '#eeeeee';
      px(-7, -3, 14, 7, bc);
      px(-9, -8,  6, 7, fr ? '#2244aa' : '#111');
      px(-13,-6,  5, 2, fr ? '#4477aa' : '#ff8800');
      ctx.fillStyle = fr ? '#88ccff' : '#ff2222';
      ctx.fillRect(-7, -7, 2, 2);
      const f = Math.abs(Math.sin(tick * 0.35 + e.wx * 0.04)) * 3;
      px(-7, -3 - f, 14, 2, '#ddd');
      px(-7,  4 + f, 14, 2, '#ddd');
    }

  } else if (e.type === 'mom') {
    // Radioactive Mom — pink top, pushing stroller toward player
    const stDir = player.x < e.wx ? -1 : 1; // stroller between mom and player
    const stX   = stDir * 12;
    ctx.fillStyle = fr ? 'rgba(80,150,255,0.15)' : 'rgba(255,120,200,0.15)';
    ctx.fillRect(-14, -13, 30, 28);
    // Stroller (visual — in front of mom)
    px(stX - 6, -5, 12,  9, '#999');
    px(stX - 5, -6, 10,  5, '#bbb'); // hood
    px(stX - 5,  4,  4,  3, '#444'); // wheels
    px(stX + 1,  4,  4,  3, '#444');
    px(stX - 2, -3,  4,  4, '#f5c99a'); // baby head (tiny)
    // Mom body
    const top = fr ? '#6644aa' : '#cc44aa';
    const leg = fr ? '#3355aa' : '#994488';
    px(-6, -6, 10, 11, top);
    px(-4,-12,  8,  7, fr ? '#88aacc' : '#f5c99a');
    ctx.fillStyle = fr ? '#88ccff' : '#00ff44';
    ctx.fillRect(-2,-11, 2, 2); ctx.fillRect(2,-11, 2, 2);
    px(-5, 5, 4, 7, leg); px(0, 5, 4, 7, leg);
  }

  // HP bar (only when damaged)
  if (e.hp < e.maxHp) {
    const bw = e.type === 'mom' ? 26 : 14;
    px(-bw/2, -18, bw, 2, '#440000');
    px(-bw/2, -18, Math.round(bw * e.hp / e.maxHp), 2, e.type === 'mom' ? '#ff55bb' : '#00ff44');
  }

  ctx.restore();

  // Stop sign "S" text (drawn outside translate to keep it upright)
  if (e.type === 'guard' && !fr) {
    ctx.fillStyle = '#cc1111';
    ctx.font = '4px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('S', sx + 10, sy - 4);
    ctx.textAlign = 'left';
  }
}

function drawHazard(h) {
  if (h.type !== 'mower') return;
  const sx = Math.round(h.wx - camX), sy = Math.round(h.y);
  if (sx < -30 || sx > LW + 30) return;
  // Mower body
  px(sx - 14, sy + 2, 28, 10, '#228822');
  px(sx - 12, sy + 10, 7, 4, '#111');
  px(sx + 5,  sy + 10, 7, 4, '#111');
  // Rider
  px(sx - 4,  sy - 6, 8, 8, '#cc4400'); // orange polo (he's also glowing)
  px(sx - 2,  sy -12, 5, 6, '#f5c99a'); // head
  // Exhaust puff
  if (Math.floor(tick / 8) % 2 === 0) {

function drawItem(item) {

    ctx.fillStyle = '#ffdd57';
    ctx.font = '4px "Press Start 2P"';
    ctx.textAlign = 'center';

function drawProjectile(p) {
  const sx = Math.round(p.wx - camX);
  if (sx < -10 || sx > LW + 10) return;
  if (p.ptype === 'cake') {
    ctx.save();
    ctx.translate(sx, Math.round(p.y));
    ctx.rotate(tick * 0.3);
    px(-5, -2, 10, 4, '#c8842a');
    px(-3, -1,  6, 2, '#f5dda0');
    ctx.restore();
  } else {
    px(sx - 3, Math.round(p.y) - 3, 7, 7, '#ffb3c6');
    px(sx - 1, Math.round(p.y) - 1, 3, 3, '#ffffff');
  }
}

function drawParticles() {
  for (const p of particles) {
    const sx = Math.round(p.wx - camX);
    if (sx < -8 || sx > LW + 8) continue;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    const s = Math.ceil(p.size);
    ctx.fillRect(Math.round(sx - s / 2), Math.round(p.y - s / 2), s, s);
  }
  ctx.globalAlpha = 1;
}

// ── AI HARNESS ────────────────────────────────────────────────────────────
function parseAICommand(raw) {
  const cmd = raw.trim().toLowerCase();
  aiCmd.lastCommand = raw.trim();

  // Movement: "go right 50 pixels", "move up 30", etc.
  const moveMatch = cmd.match(/^(?:go|move)\s+(right|left|up|down)\s+(\d+(?:\.\d+)?)/);
  if (moveMatch) {
    const dir = moveMatch[1], dist = parseFloat(moveMatch[2]);
    const dx = dir === 'right' ? dist : dir === 'left'  ? -dist : 0;
    const dy = dir === 'down'  ? dist : dir === 'up'    ? -dist : 0;
    aiCmd.pendingMove = { dx, dy };
    aiCmd.lastResult  = `moving ${dir} ${dist}px`;
    return;
  }

  // Fire soft serve: "fire", "fire weapon", "fire softserve", "shoot"
  if (/^(fire(\s+(weapon|soft.?serve|ss))?|shoot)$/.test(cmd)) {
    aiCmd.fireSS     = true;
    aiCmd.lastResult = 'fire softserve';
    return;
  }

  // Fire funnel cake: "fire cake", "use cake", "throw cake"
  if (/^(fire\s+cake|use\s+cake|throw\s+cake)$/.test(cmd)) {
    aiCmd.fireFC     = true;
    aiCmd.lastResult = 'fire cake';
    return;
  }

  // Swap weapon
  if (/^(swap(\s+weapon)?)$/.test(cmd)) {
    aiCmd.selectedWeapon = aiCmd.selectedWeapon === 'softserve' ? 'cake' : 'softserve';
    aiCmd.lastResult     = 'weapon: ' + aiCmd.selectedWeapon;
    return;
  }

  // Select weapon: "select cake", "select softserve"
  const selMatch = cmd.match(/^select\s+(softserve|soft.?serve|ss|cake|funnel.?cake|fc)$/);
  if (selMatch) {
    aiCmd.selectedWeapon = /cake/.test(selMatch[1]) ? 'cake' : 'softserve';
    aiCmd.lastResult     = 'weapon: ' + aiCmd.selectedWeapon;
    return;
  }

  // Start / restart game
  if (/^start(\s+game)?$/.test(cmd)) {
    startGame();
    aiCmd.lastResult = 'game started';
    return;
  }

  aiCmd.lastResult = 'unknown: "' + cmd + '"';
}

// ── GAME LOGIC ────────────────────────────────────────────────────────────
function splat(wx, y, n = 6, cols = ['#ffb3c6', '#ffffff', '#ff88aa']) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 1.8;
    particles.push({
      wx, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      color: cols[Math.floor(Math.random() * cols.length)],
      size: 2 + Math.random() * 3,
      life: 18 + Math.random() * 22, maxLife: 40,
    });
  }
}

function trySpawn() {
  while (spawnIdx < SPAWNS.length) {
    const s = SPAWNS[spawnIdx];
    if (s.wx > camX + LW + 60) break;
    const y = s.wy ?? (G_TOP + 28 + Math.random() * (G_BOT - G_TOP - 40));

    if (s.type === 'cake_item') {
      items.push({ type: 'cake', wx: s.wx, y: G_TOP + 20, collected: false });
    } else if (s.type === 'mower') {
      hazards.push({ type: 'mower', wx: s.wx, y: G_TOP + 35, vx: 1.4, minWx: 155, maxWx: 420 });
    } else {
      const cfg = {
        dad:   { hp: 3, maxHp: 3, speed: 0.5, score: 150, chargeState: 'patrol', warnTimer: 0, chargeTimer: 0, chargeVx: 0, chargeVy: 0 },
        guard: { hp: 2, maxHp: 2, speed: 0.38, score: 100, patrolOrigin: s.wx, patrolDir: 1 },
        goose: { hp: 2, maxHp: 2, speed: 1.1,  score: 150 },
        mom:   { hp: 9, maxHp: 9, speed: 0.5,  score: 500, chargeState: 'patrol', warnTimer: 0, chargeTimer: 0, chargeVx: 0, chargeVy: 0 },
      }[s.type];
      if (cfg) enemies.push({ wx: s.wx, y, type: s.type, frozenTimer: 0, ...cfg });
    }
    spawnIdx++;
  }
}

function update() {
  tick++;
  if (state !== 'playing') return;

  // ── Movement ─────────────────────────────────────────────────────────
  let mx = 0, my = 0;
  if (keys['ArrowLeft']  || keys['a']) mx -= 1;
  if (keys['ArrowRight'] || keys['d']) mx += 1;
  if (keys['ArrowUp']    || keys['w']) my -= 1;
  if (keys['ArrowDown']  || keys['s']) my += 1;
  if (joy.active) { mx += joy.dx; my += joy.dy; }
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  player.x = Math.max(10, Math.min(LEVEL_W - 10, player.x + mx * P_SPEED));
  player.y = Math.max(G_TOP + 8, Math.min(G_BOT - 8, player.y + my * P_SPEED));

  // ── AI movement command ───────────────────────────────────────────────
  if (aiCmd.pendingMove) {
    const { dx, dy } = aiCmd.pendingMove;
    player.x = Math.max(10, Math.min(LEVEL_W - 10, player.x + dx));
    player.y = Math.max(G_TOP + 8, Math.min(G_BOT - 8, player.y + dy));
    if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) player.angle = Math.atan2(dy, dx);
    aiCmd.pendingMove = null;
  }

  // ── Aim & fire angle ──────────────────────────────────────────────────
  let nearest = null, nearestD = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.wx - player.x, e.y - player.y);
    if (d < nearestD) { nearestD = d; nearest = e; }
  }
  if (ml > 0.15)      player.angle = Math.atan2(my, mx);
  else if (nearest)   player.angle = Math.atan2(nearest.y - player.y, nearest.wx - player.x);
  const fa = nearest
    ? Math.atan2(nearest.y - player.y, nearest.wx - player.x)
    : player.angle;

  // ── Soft serve fire ───────────────────────────────────────────────────
  const wantSS = keys[' '] || keys['z'] || keys['x'] || btnSS.active || aiCmd.fireSS;
  if (wantSS && player.heat < OVERHEAT && player.fireCd <= 0) {
    projs.push({ ptype: 'softserve',
      wx: player.x + Math.cos(fa) * 15, y: player.y + Math.sin(fa) * 15,
      vx: Math.cos(fa) * PROJ_SPEED,    vy: Math.sin(fa) * PROJ_SPEED, life: 85 });
    player.heat  = Math.min(OVERHEAT, player.heat + HEAT_GAIN);
    player.fireCd = SS_FIRE_CD;
  }
  aiCmd.fireSS = false;

  // ── Funnel cake throw ─────────────────────────────────────────────────
  const wantFC = (keys['f'] || keys['F'] || btnFC.active || aiCmd.fireFC) && player.cakes > 0;
  if (wantFC && player.cakeCd <= 0) {
    projs.push({ ptype: 'cake',
      wx: player.x + Math.cos(fa) * 15, y: player.y + Math.sin(fa) * 15,
      vx: Math.cos(fa) * CAKE_SPEED,    vy: Math.sin(fa) * CAKE_SPEED, life: 110 });
    player.cakes--;
    player.cakeCd = CAKE_CD;
  }
  aiCmd.fireFC = false;

  if (player.fireCd  > 0) player.fireCd--;
  if (player.cakeCd  > 0) player.cakeCd--;
  player.heat = Math.max(0, player.heat - HEAT_COOL);
  if (player.iframes > 0) player.iframes--;

  // ── Camera ────────────────────────────────────────────────────────────
  camX = Math.max(0, Math.min(LEVEL_W - LW, player.x - LW / 3));
  if (player.x > 1158) { state = 'win'; return; }

  trySpawn();

  // ── Item pickup ───────────────────────────────────────────────────────
  for (const item of items) {
    if (item.collected) continue;
    if (Math.abs(player.x - item.wx) < 16 && Math.abs(player.y - item.y) < 16) {
      item.collected = true;
      player.cakes = Math.min(MAX_CAKES, player.cakes + 3);
      splat(item.wx, item.y, 8, ['#c8842a', '#f5dda0', '#fff']);
    }
  }

  // ── Projectiles ───────────────────────────────────────────────────────
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];
    p.wx += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0 || p.wx < 0 || p.wx > LEVEL_W) { projs.splice(i, 1); continue; }

    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      // Mom's stroller zone blocks projectiles (stroller is between her and player)
      if (e.type === 'mom') {
        const stDir  = player.x < e.wx ? -1 : 1;
        const stWx   = e.wx + stDir * 12;
        if (Math.abs(p.wx - stWx) < 9 && Math.abs(p.y - e.y) < 9) {
          // Deflect — splat on stroller, no damage
          splat(stWx, e.y, 4, ['#aaaaaa', '#ffffff']);
          projs.splice(i, 1); hit = true; break;
        }
      }
      const hr = e.type === 'mom' ? 10 : 9;
      if (Math.abs(p.wx - e.wx) < hr && Math.abs(p.y - e.y) < hr) {
        if (p.ptype === 'cake') {
          e.frozenTimer = 240; // 4s — distracted eating
          splat(e.wx, e.y, 8, ['#c8842a', '#f5dda0', '#fff']);
        } else {
          e.hp--;
          e.frozenTimer = 90;
          if (e.type === 'dad' || e.type === 'mom') e.chargeState = 'patrol';
          splat(e.wx, e.y);
          if (e.hp <= 0) { splat(e.wx, e.y, e.type==='goose' ? 16 : 12, e.type==='goose' ? ['#fff','#ddd','#f5f5dc','#aaa'] : undefined); enemies.splice(j, 1); score += e.score || 100; }
        }
        projs.splice(i, 1); hit = true; break;
      }
    }
    if (hit) continue;
  }

  // ── Enemy AI ──────────────────────────────────────────────────────────
  for (const e of enemies) {
    if (e.frozenTimer > 0) { e.frozenTimer--; continue; }

    const dx = player.x - e.wx, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);

    if (e.type === 'dad' || e.type === 'mom') {
      const warnDist  = e.type === 'mom' ? 90 : 75;
      const baseChSpd = e.type === 'mom' ? 2.2 : 3.0;
      // Mom gets faster as HP drops
      const chSpd = e.type === 'mom' ? baseChSpd + (1 - e.hp / e.maxHp) * 1.8 : baseChSpd;

      if (e.chargeState === 'patrol') {
        if (dist > 0) { e.wx += (dx / dist) * e.speed; e.y += (dy / dist) * e.speed; }
        if (dist < warnDist) { e.chargeState = 'warn'; e.warnTimer = 52; }

      } else if (e.chargeState === 'warn') {
        e.warnTimer--;
        if (e.warnTimer <= 0) {
          e.chargeState = 'charge';
          e.chargeTimer = 55;
          const d2 = Math.hypot(dx, dy);
          e.chargeVx = (dx / d2) * chSpd;
          e.chargeVy = (dy / d2) * chSpd;
        }

      } else if (e.chargeState === 'charge') {
        e.wx += e.chargeVx; e.y += e.chargeVy;
        e.chargeTimer--;
        e.y = Math.max(G_TOP + 8, Math.min(G_BOT - 8, e.y));
        if (e.chargeTimer <= 0 || e.wx < 5 || e.wx > LEVEL_W - 5) e.chargeState = 'patrol';
      }

    } else if (e.type === 'guard') {
      if (dist < 65) {
        if (dist > 0) { e.wx += (dx / dist) * e.speed; e.y += (dy / dist) * e.speed; }
      } else {
        e.wx += e.patrolDir * e.speed * 0.7;
        if (Math.abs(e.wx - e.patrolOrigin) > 44) e.patrolDir *= -1;
      }

    } else if (e.type === 'goose') {
      if (dist > 0) { e.wx += (dx / dist) * e.speed; e.y += (dy / dist) * e.speed; }
    }

    // Player contact damage
    const contactR = e.type === 'mom' ? 11 : 10;
    if (dist < contactR && player.iframes <= 0) {
      player.hp--;
      player.iframes = 80;
      if (player.hp <= 0) state = 'dead';
    }
  }

  // ── Lawnmower hazard ──────────────────────────────────────────────────
  for (const h of hazards) {
    if (h.type !== 'mower') continue;
    h.wx += h.vx;
    if (h.wx > h.maxWx || h.wx < h.minWx) h.vx *= -1;
    if (Math.abs(player.x - h.wx) < 16 && Math.abs(player.y - h.y) < 14 && player.iframes <= 0) {
      player.hp--;
      player.iframes = 80;
      if (player.hp <= 0) state = 'dead';
    }
  }

  // ── Particles ─────────────────────────────────────────────────────────
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.wx += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function startGame() {
  Object.assign(player, { x: 55, y: LH / 2, angle: 0, hp: 5, heat: 0, fireCd: 0, iframes: 0, cakes: 0, cakeCd: 0 });
  projs = []; enemies = []; hazards = []; items = []; particles = [];
  camX = 0; score = 0; tick = 0; spawnIdx = 0;
  state = 'playing';
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  updateCanvasOffset();
  updateAIDebug(); // always update — keeps data-* attrs readable in all states
  if (state === 'title') { drawTitle(); return; }

  ctx.fillStyle = '#7ec8e3';
  ctx.fillRect(0, 0, LW, LH);
  drawBg();

  for (const item of items) drawItem(item);
  for (const p of projs)   drawProjectile(p);

  const ents = [
    ...enemies.map(e  => ({ draw: () => drawEnemy(e),   y: e.y  })),
    ...hazards.map(h  => ({ draw: () => drawHazard(h),  y: h.y  })),
    { draw: drawPlayer, y: player.y },
  ].sort((a, b) => a.y - b.y);
  for (const e of ents) e.draw();

  drawParticles();
  drawHUD();

  if (verticalMode) {
    const hasCakes = player.cakes > 0;
    cakeBtnEl.style.opacity = hasCakes ? '1' : '0.38';
    cakeBtnEl.textContent   = hasCakes ? 'CAKE ×' + player.cakes : 'CAKE';
  }

  if (state === 'dead') drawOverlay(
    ['GAME OVER', 'SCORE: ' + score],
    ['#ff4466', '#ffdd57']
  );
  if (state === 'win')  drawOverlay(
    ['SECTION CLEAR!', 'SCORE: ' + score, 'THE PARK AWAITS...'],
    ['#00ff66', '#ffdd57', '#aaffaa']
  );

  updateAIDebug();
}

canvas.addEventListener('pointerdown', () => {
  if (state === 'dead' || state === 'win') startGame();
});

// ── LOOP ──────────────────────────────────────────────────────────────────
(function loop() { update(); render(); requestAnimationFrame(loop); })();

// Auto-enable vertical mode on portrait screens (TikTok brain default)
if (window.innerHeight > window.innerWidth * 1.2) setVerticalMode(true);
</script>
</body>
