name: Auto Create and Merge PR

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            pr_number="$existing"
          else
            title=$(git log -1 --pretty=%s)
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "$title" \
              --body "Auto-merged from \`${{ github.ref_name }}\`"
            pr_number=$(gh pr view "${{ github.ref_name }}" \
              --json number \
              --jq '.number')
          fi

          echo "PR #$pr_number - merging..."

          merged=false
          for i in 1 2 3 4 5; do
            if gh pr merge "$pr_number" --squash --delete-branch; then
              merged=true
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          if [ "$merged" != true ]; then
            echo "Failed to merge PR #$pr_number after 5 attempts."
            exit 1
          fi
